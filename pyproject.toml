[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sit-monitor"
version = "1.5.8"
description = "坐姿监控程序 - 使用摄像头检测不良坐姿并发送系统通知"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Benjia Zou" }]
dependencies = [
    # mediapipe 必须 <1.0：1.0.1 在 macOS 上 Metal/GPU 初始化直接 FATAL
    # （graph_service.h "Check failed: service_ Service is unavailable"），
    # 进程启动即崩、被 KeepAlive 反复拉起（实测 2026-08-15 崩了 48 次）。
    # 0.10.32 长期验证可用。
    # ★★ 以下二进制包必须钉「确切版本」，不能用范围。
    # macOS 的 AMFI 拒绝加载这些 wheel 里 adhoc 签名的 .so/.dylib
    #   amfid: "not valid ... adhoc signed or signed by an unknown certificate chain"
    # 加载即 SIGKILL，进程闪退、launchd 反复拉起（launchctl status=-9）。
    # 实测 2026-09-08 被杀：opencv 5.0.0.93 / 4.14.0.94、Pillow 12.3.0 / 12.2.0、
    # numpy 2.5.3 / 2.4.6、mediapipe 0.10.35 —— 注意范围约束不管用，
    # 范围内较新的版本同样被杀，只有下面这组确切版本长期验证可用。
    # 升级任何一个之前，必须先实测 `python -c "import cv2, PIL.Image, mediapipe"`
    # 不被 SIGKILL（exit 137）。
    "mediapipe==0.10.32",
    "opencv-python==4.13.0.92",
    "numpy==2.4.2",
    "Pillow==12.1.1",
    "rumps",
    "httpx>=0.27",
    "certifi",  # mediapipe>=0.10.35 运行时调用 certifi.where()，但未声明此依赖
    # 深度休眠靠 Quartz 读键鼠空闲秒数。rumps 只拉 pyobjc-framework-Cocoa，
    # 不含 Quartz——brew 安装环境曾因此 import 失败，深度休眠静默失效。
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[project.scripts]
sit-monitor = "sit_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["sit_monitor*"]

[tool.setuptools.package-data]
sit_monitor = ["assets/*.png", "i18n/*.py"]
